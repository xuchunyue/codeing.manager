var xjVehicles=data.filter(d=>d.store==='新疆').length>0?data.filter(d=>d.store==='新疆')[0].vehicles:132;
var totalDrivers=tjDrivers+wxDrivers+xjDrivers;
var totalVehicles=tjVehicles+wxVehicles+xjVehicles;
var dates=[...new Set(data.map(d=>d.date))].sort();
var latestDate=dates[dates.length-1];
var latestDayData=data.filter(d=>d.date===latestDate);
var dailyRev=latestDayData.reduce((s,d)=>s+d.revenue,0);
var janData=data.filter(d=>d.date.startsWith('2026-01'));
var janRev=janData.reduce((s,d)=>s+d.revenue,0);
var janCost=janData.reduce((s,d)=>s+d.cost,0);
var avgPerCar=Math.round(janRev*10000/totalVehicles);
return{totalDrivers,totalVehicles,dailyRev,janRev,janCost,avgPerCar,latestDate};
}

function getStoreSummary(data){
return['天津','无锡','新疆'].map(function(s){
var sd=data.filter(d=>d.store===s);
var rev=sd.reduce((sm,d)=>sm+d.revenue,0);
var cost=sd.reduce((sm,d)=>sm+d.cost,0);
var profit=sd.reduce((sm,d)=>sm+d.profit,0);
var drivers=sd.length>0?sd[0].drivers:0;
var vehicles=sd.length>0?sd[0].vehicles:0;
return{store:s,drivers,vehicles,revenue:Math.round(rev*100)/100,cost:Math.round(cost*100)/100,profit:Math.round(profit*100)/100};
});
}

var stats=calcStats(allData);
document.getElementById('totalDrivers').innerHTML=stats.totalDrivers.toLocaleString()+' 人';
document.getElementById('totalVehicles').innerHTML=stats.totalVehicles.toLocaleString()+' 辆';
var dr2=document.getElementById('dailyRevenue'); if(dr2) dr2.innerHTML='¥ '+stats.dailyRev.toFixed(2)+' 万';
document.getElementById('monthlyRevenue').innerHTML='¥ '+stats.janRev.toFixed(1)+' 万';
document.getElementById('avgRevenuePerCar').innerHTML='¥ '+stats.avgPerCar.toLocaleString();

function renderTable(data){
var tbody=document.getElementById('tableBody');
var html='';
data.forEach(function(d){
var pc=d.profit>=0?'profit-up':'profit-down';
var sc=d.store==='天津'?'badge-tj':d.store==='无锡'?'badge-wx':'badge-xj';
html+='<tr><td><span class="badge-store '+sc+'">'+d.store+'</span></td><td>'+d.company+'</td><td class="drill-down-clickable">'+d.vehicles.toLocaleString()+'</td><td class="drill-down-clickable">'+d.drivers.toLocaleString()+'</td><td class="drill-down-clickable">'+d.revenue.toFixed(2)+'</td><td>'+d.cost.toFixed(2)+'</td><td class="'+pc+'">'+(d.profit>=0?'+':'')+d.profit.toFixed(2)+'</td></tr>';
});
tbody.innerHTML=html;
}
renderTable(allData);

var currentDateType='month';
function switchDateType(btn,type){
document.querySelectorAll('.filter-row .filter-btn').forEach(function(b){b.classList.remove('filter-btn-active');});
btn.classList.add('active');currentDateType=type;
var container=document.getElementById('datePickerContainer');
var val='',tp='';
if(type==='day'){tp='date';val='2026-02-05';}
else if(type==='month'){tp='month';val='2026-02';}
else if(type==='quarter'){tp='month';val='2026-01';}
else{container.innerHTML='<select id=\"datePicker\" onchange=\"applyFilters()\"><option value=\"2025\">2025年</option><option value=\"2026\" selected>2026年</option></select>';applyFilters();return;}
container.innerHTML='<input id=\"datePicker\" onchange=\"applyFilters()\" type=\"'+tp+'\" value=\"'+val+'\"/>';
applyFilters();
}
function applyFilters(){
var store=document.getElementById('storeFilter').value;
var dp=document.getElementById('datePicker').value;
var filtered=allData;
if(store!=='all')filtered=filtered.filter(d=>d.store===store);
if(dp)filtered=filtered.filter(d=>d.date.startsWith(dp.substring(0,7)));
renderTable(filtered);
updateCharts(filtered);
var s=calcStats(filtered);
document.getElementById('totalDrivers').innerHTML=s.totalDrivers.toLocaleString()+' 人';
document.getElementById('totalVehicles').innerHTML=s.totalVehicles.toLocaleString()+' 辆';
var drEl=document.getElementById('dailyRevenue'); if(drEl) drEl.innerHTML='¥ '+s.dailyRev.toFixed(2)+' 万';
document.getElementById('monthlyRevenue').innerHTML='¥ '+s.janRev.toFixed(1)+' 万';
document.getElementById('avgRevenuePerCar').innerHTML='¥ '+s.avgPerCar.toLocaleString();
}

function getDriverOption(data){
var sum=getStoreSummary(data);
return{color:ECHARTS_THEME_COLORS,backgroundColor:'#ffffff',tooltip:{trigger:'axis',formatter:function(params){var p=params[0];return p.axisValue+'<br/>司机数: '+p.value+' 人';},backgroundColor:'#ffffff',borderColor:'#e8ecf1',textStyle:{color:'#333'}},grid:{left:'3%',right:'4%',bottom:'3%',containLabel:true},xAxis:{type:'category',data:sum.map(s=>s.store),axisLine:{lineStyle:{color:'#e8ecf1'}},axisLabel:{color:'#8c8c8c'}},yAxis:{type:'value',splitLine:{lineStyle:{color:'#f0f0f0'}},axisLabel:{color:'#8c8c8c'}},series:[{type:'bar',data:sum.map(s=>s.drivers),itemStyle:{color:'#1890ff',borderRadius:[4,4,0,0]}}]};
}

function getPieOption(data){
var sum=getStoreSummary(data);
var colors=['#1890ff','#722ed1','#52c41a'];
return{color:ECHARTS_THEME_COLORS,backgroundColor:'#ffffff',tooltip:{trigger:'item',formatter:function(p){return p.name+': ¥'+p.value+'万 ('+p.percent+'%)';},backgroundColor:'#ffffff',borderColor:'#e8ecf1',textStyle:{color:'#333'}},series:[{type:'pie',radius:['40%','70%'],avoidLabelOverlap:false,itemStyle:{borderRadius:8,borderColor:'#ffffff',borderWidth:3},label:{show:true,position:'outside',formatter:'{b}\n¥{c}万 ({d}%)',fontSize:11,color:'#595959'},labelLine:{length:10,length2:15,lineStyle:{color:'#d9d9d9'}},data:sum.map(function(s,i){return{value:Math.round(s.revenue*100)/100,name:s.store,itemStyle:{color:colors[i]}};})}]};
}

function getVehiclePerStore(data){
var stores=['天津','无锡','新疆'];
var counts=stores.map(function(s){
var d=data.filter(function(r){return r.store===s;});
return d.length>0?d[0].vehicles:0;
});
return{color:ECHARTS_THEME_COLORS,backgroundColor:'#ffffff',
tooltip:{trigger:'axis',formatter:function(p){return '<b>'+p[0].name+'</b><br/>车辆数: <b>'+p[0].value.toLocaleString()+' 辆</b>';},backgroundColor:'#ffffff',borderColor:'#e8ecf1',textStyle:{color:'#333'}},
grid:{left:'3%',right:'4%',bottom:'3%',containLabel:true},
xAxis:{type:'category',data:stores,axisLine:{lineStyle:{color:'#e8ecf1'}},axisLabel:{color:'#8c8c8c',fontSize:13}},
yAxis:{type:'value',splitLine:{lineStyle:{color:'#f0f0f0'}},axisLabel:{color:'#8c8c8c',formatter:'{value} 辆'}},
series:[{type:'bar',barWidth:'40%',data:counts.map(function(v,i){return{value:v,itemStyle:{color:ECHARTS_THEME_COLORS[i%6],borderRadius:[4,4,0,0]}};}),label:{show:true,position:'top',formatter:'{c} 辆',color:'#333',fontSize:12,fontWeight:'bold'}}]
};
}

function updateCharts(data){
var dc=echarts.getInstanceByDom(document.getElementById('driverChart'));if(dc)dc.setOption(getDriverOption(data),true);
var pc=echarts.getInstanceByDom(document.getElementById('pieChart'));if(pc)pc.setOption(getPieOption(data),true);
var tc=echarts.getInstanceByDom(document.getElementById('trendChart'));if(tc)tc.setOption(getVehiclePerStore(data),true);
}

function initCharts(){
var combinedChart=echarts.init(document.getElementById('combinedChart'));
combinedChart.setOption(getCombinedOption(allData));
combinedChart.on('click',function(p){
var si=p.dataIndex;
var stores=['天津','无锡','新疆'];
var sd=allData.filter(d=>d.store===stores[si]);
var totalD=sd.length>0?sd[0].drivers:0;
var totalV=sd.length>0?sd[0].vehicles:0;
var totalR=Math.round(sd.reduce((s,d)=>s+d.revenue,0)*100)/100;
showCustomDrill(stores[si]+' - 司机与车辆明细',[{label:'门店',value:stores[si],color:'#1890ff'},{label:'司机数',value:totalD.toLocaleString()+' 人',color:'#1a2332'},{label:'车辆数',value:totalV.toLocaleString()+' 辆',color:'#52c41a'},{label:'总营收',value:'¥ '+totalR.toFixed(1)+' 万',color:'#fa8c16'}],[['门店','所属公司','车辆数','司机数','营收(万)','成本(万)','利润(万)'],...sd.map(d=>[d.store,d.company,d.vehicles.toLocaleString(),d.drivers.toLocaleString(),d.revenue.toFixed(2),d.cost.toFixed(2),(d.profit>=0?'+':'')+d.profit.toFixed(2)])]);
});
window.addEventListener('resize',function(){combinedChart.resize();});

var pieChart=echarts.init(document.getElementById('pieChart'));
pieChart.setOption(getPieOption(allData));
pieChart.on('click',function(p){
var sd=allData.filter(d=>d.store===p.name);
var totalR=Math.round(sd.reduce((s,d)=>s+d.revenue,0)*100)/100;
showCustomDrill(p.name+' - 营收明细',[{label:'门店',value:p.name,color:'#1890ff'},{label:'总营收',value:'¥ '+totalR.toFixed(1)+' 万',color:'#fa8c16'},{label:'总成本',value:'¥ '+Math.round(sd.reduce((s,d)=>s+d.cost,0)*100)/100+' 万',color:'#f5222d'},{label:'总利润',value:'¥ '+Math.round(sd.reduce((s,d)=>s+d.profit,0)*100)/100+' 万',color:'#52c41a'}],[['门店','所属公司','车辆数','司机数','营收(万)','成本(万)','利润(万)'],...sd.map(d=>[d.store,d.company,d.vehicles.toLocaleString(),d.drivers.toLocaleString(),d.revenue.toFixed(2),d.cost.toFixed(2),(d.profit>=0?'+':'')+d.profit.toFixed(2)])]);
});
window.addEventListener('resize',function(){pieChart.resize();});

var revTrendChart=echarts.init(document.getElementById('revenueTrendChart'));
revTrendChart.setOption(getRevenueTrendOption(allData));
revTrendChart.on('click',function(p){
var mnths=['2026-01','2026-02'];
var md=allData.filter(function(d){return d.date.startsWith(mnths[p.dataIndex]);});
var totalR=Math.round(md.reduce((s,d)=>s+d.revenue,0)*100)/100;
var totalP=Math.round(md.reduce((s,d)=>s+d.profit,0)*100)/100;
showCustomDrill(mnths[p.dataIndex]+' - 月度营收明细',[{label:'月份',value:mnths[p.dataIndex],color:'#1890ff'},{label:'总营收',value:'¥ '+totalR.toFixed(1)+' 万',color:'#fa8c16'},{label:'总利润',value:'¥ '+totalP.toFixed(1)+' 万',color:'#52c41a'}],[['门店','所属公司','车辆数','司机数','营收(万)','成本(万)','利润(万)'],...md.map(d=>[d.store,d.company,d.vehicles.toLocaleString(),d.drivers.toLocaleString(),d.revenue.toFixed(2),d.cost.toFixed(2),(d.profit>=0?'+':'')+d.profit.toFixed(2)])]);
});
window.addEventListener('resize',function(){revTrendChart.resize();});
}

function showCustomDrill(title,summaryItems,tableData,sourceFile){
document.getElementById('modalTitle').innerText=title;
if(sourceFile)document.getElementById('modalSource').innerHTML='<iconify-icon icon="mdi:file-excel" style="vertical-align:middle;color:#52c41a;"></iconify-icon> 来源系统：出租车管理系统 | 来源表：'+sourceFile;
var s='';
summaryItems.forEach(function(i){s+='<div class="modal-summary-item"><div class="label">'+i.label+'</div><div class="value" style="color:'+i.color+'">'+i.value+'</div></div>';});
document.getElementById('modalSummary').innerHTML=s;
var h='<table><thead><tr>';
tableData[0].forEach(function(c){h+='<th>'+c+'</th>';});
h+='</tr></thead><tbody>';
for(var i=1;i<tableData.length;i++){h+='<tr>';tableData[i].forEach(function(c){h+='<td>'+c+'</td>';});h+='</tr>';}
h+='</tbody></table>';
document.getElementById('modalTableContainer').innerHTML=h;
document.getElementById('drillDownModal').classList.add('show');
}

function hideDrillDown(){document.getElementById('drillDownModal').classList.remove('show');}


function getCombinedOption(data){
var stores=['天津','无锡','新疆'];
var drivers=stores.map(function(s){var d=data.filter(function(x){return x.store===s;});return d.length>0?d[0].drivers:0;});
var vehicles=stores.map(function(s){var d=data.filter(function(x){return x.store===s;});return d.length>0?d[0].vehicles:0;});
return {color:['#1890ff','#52c41a'],backgroundColor:'#ffffff',
tooltip:{trigger:'axis',backgroundColor:'#ffffff',borderColor:'#e8ecf1',textStyle:{color:'#333'}},
legend:{data:['司机数','车辆数'],textStyle:{color:'#8c8c8c',fontSize:12},top:0},
grid:{left:'3%',right:'4%',bottom:'3%',top:'18%',containLabel:true},
xAxis:{type:'category',data:stores,axisLine:{lineStyle:{color:'#e8ecf1'}},axisLabel:{color:'#8c8c8c'}},
yAxis:{type:'value',splitLine:{lineStyle:{color:'#f0f0f0'}},axisLabel:{color:'#8c8c8c'}},
series:[{name:'司机数',type:'bar',data:drivers,itemStyle:{color:'#1890ff',borderRadius:[4,4,0,0]},barGap:'30%',label:{show:true,position:'top',color:'#333',fontSize:11}},
{name:'车辆数',type:'bar',data:vehicles,itemStyle:{color:'#52c41a',borderRadius:[4,4,0,0]},label:{show:true,position:'top',color:'#333',fontSize:11}}]};}

function getRevenueTrendOption(data){
var months=['2026-01','2026-02'];
var revs=months.map(function(m){var md=data.filter(function(d){return d.date.startsWith(m);});return Math.round(md.reduce(function(s,d){return s+d.revenue;},0)*100)/100;});
var profits=months.map(function(m){var md=data.filter(function(d){return d.date.startsWith(m);});return Math.round(md.reduce(function(s,d){return s+d.profit;},0)*100)/100;});
return {color:['#1890ff','#52c41a'],backgroundColor:'#ffffff',
tooltip:{trigger:'axis',backgroundColor:'#ffffff',borderColor:'#e8ecf1',textStyle:{color:'#333'},formatter:function(p){var r='<b>'+p[0].axisValue+'</b>';p.forEach(function(v){r+='<br/>'+v.marker+v.seriesName+': ¥'+v.value.toFixed(1)+' 万';});return r;}},
legend:{data:['营收','利润'],textStyle:{color:'#8c8c8c',fontSize:12},top:0},
grid:{left:'3%',right:'4%',bottom:'3%',top:'18%',containLabel:true},
xAxis:{type:'category',data:['1月','2月'],axisLine:{lineStyle:{color:'#e8ecf1'}},axisLabel:{color:'#8c8c8c'}},
yAxis:{type:'value',name:'万元',nameTextStyle:{color:'#999',fontSize:11},splitLine:{lineStyle:{color:'#f0f0f0'}},axisLabel:{color:'#8c8c8c'}},
series:[{name:'营收',type:'line',smooth:true,data:revs,symbol:'circle',symbolSize:8,lineStyle:{width:3},itemStyle:{color:'#1890ff'},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(24,144,255,0.2)'},{offset:1,color:'rgba(24,144,255,0)'}])}},
{name:'利润',type:'line',smooth:true,data:profits,symbol:'circle',symbolSize:8,lineStyle:{width:3},itemStyle:{color:'#52c41a'},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(82,196,26,0.2)'},{offset:1,color:'rgba(82,196,26,0)'}])}}]};}

window.onload=function(){initCharts();};
</script>
